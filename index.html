<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PharmWS">
<meta name="theme-color" content="#2C5F8A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>薬剤師ワークスペース</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#f0efe8;--surface:#ffffff;--border:rgba(0,0,0,0.1);
  --text:#1a1a18;--text2:#666;--text3:#aaa;
  --blue:#2C5F8A;--blue-light:#E8F0F8;
  --green:#1D8A6B;--green-light:#E3F5EF;
  --red:#C0392B;--red-light:#FCEBEB;
  --orange:#C07A2B;--orange-light:#FDF0DC;
  --yellow:#B8860B;--yellow-light:#FFFDE7;
  --purple:#5B4A9C;--purple-light:#EEEDFE;
  --radius:10px;--radius-sm:6px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:var(--bg);color:var(--text);}
.app{display:flex;flex-direction:column;height:100dvh;}
.header{background:var(--blue);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.header-title{font-size:14px;font-weight:600;letter-spacing:0.02em;display:flex;align-items:center;gap:6px;}
.header-sync{font-size:10px;opacity:0.8;display:flex;align-items:center;gap:3px;background:rgba(255,255,255,0.15);padding:3px 8px;border-radius:10px;}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6px;padding:6px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px);overflow:hidden;}
.pane{background:var(--surface);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;min-height:0;}
.pane-header{padding:7px 9px 5px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.pane-title{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.06em;display:flex;align-items:center;gap:4px;}
.pane-title i{font-size:13px;}
.pane-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:7px 9px;}
.live-dot{width:5px;height:5px;background:var(--green);border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.btn-icon{background:none;border:none;cursor:pointer;color:var(--blue);font-size:15px;padding:2px;display:flex;align-items:center;}

/* カレンダー */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.cal-month{font-size:12px;font-weight:600;}
.cal-nav-btn{background:none;border:none;cursor:pointer;color:var(--text2);font-size:16px;padding:2px 4px;line-height:1;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;}
.cal-dow{font-size:8px;color:var(--text3);text-align:center;padding:2px 0;font-weight:600;}
.cal-day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:1px 0;border-radius:5px;cursor:pointer;}
.cal-day:active{background:var(--bg);}
.cal-day.today .dn{background:var(--blue);color:#fff;border-radius:50%;}
.cal-day.other-month{opacity:0.25;}
.dn{width:19px;height:19px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;}
.sc{font-size:7px;font-weight:700;padding:0px 2px;border-radius:2px;line-height:1.5;}
.sc-day{background:var(--green-light);color:var(--green);}
.sc-off{background:var(--bg);color:var(--text3);}
.sc-work{background:var(--orange-light);color:var(--orange);}
.ep{width:3px;height:3px;background:var(--blue);border-radius:50%;}

/* スケジュール */
.sched-date{font-size:11px;font-weight:600;color:var(--text);margin-bottom:6px;}
.tl-item{display:flex;gap:6px;margin-bottom:6px;align-items:flex-start;}
.tl-time{font-size:9px;color:var(--text2);width:28px;text-align:right;flex-shrink:0;padding-top:3px;line-height:1.4;}
.tl-bar{width:2px;border-radius:1px;flex-shrink:0;min-height:24px;align-self:stretch;}
.bar-day{background:var(--green);}
.bar-off{background:var(--text3);}
.bar-work{background:var(--orange);}
.bar-gcal{background:var(--blue);}
.tl-txt{font-size:11px;color:var(--text);line-height:1.4;flex:1;}
.tl-sub{font-size:9px;color:var(--text3);}
.no-ev{font-size:11px;color:var(--text3);text-align:center;padding:12px 0;}

/* タスク — タブなし・期限順 */
.task-item{display:flex;align-items:flex-start;gap:6px;padding:6px 8px;border-radius:6px;border-left:3px solid #ccc;background:var(--bg);margin-bottom:5px;}
.task-item.done{opacity:0.45;}
.task-item.done .task-nm{text-decoration:line-through;}
.task-cb{width:14px;height:14px;flex-shrink:0;margin-top:2px;accent-color:var(--blue);}
.task-nm{font-size:11px;color:var(--text);line-height:1.35;flex:1;}
.task-meta{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px;align-items:center;}
.tag{font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;}
.tag-red{background:var(--red-light);color:var(--red);}
.tag-yellow{background:var(--yellow-light);color:var(--yellow);}
.tag-blue{background:var(--blue-light);color:var(--blue);}
.tag-green{background:var(--green-light);color:var(--green);}
.tag-gray{background:var(--bg);color:var(--text3);border:0.5px solid var(--border);}
.tag-hi{background:var(--red-light);color:var(--red);}
.tag-mi{background:var(--orange-light);color:var(--orange);}
.tag-lo{background:var(--green-light);color:var(--green);}
.task-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:11px;padding:0;flex-shrink:0;}
.empty{font-size:11px;color:var(--text3);text-align:center;padding:14px 0;}

/* MR */
.mr-card{border:0.5px solid var(--border);border-radius:6px;padding:6px 8px;margin-bottom:5px;border-left:3px solid var(--blue);}
.mr-nm{font-size:11px;font-weight:600;color:var(--text);}
.mr-meta{font-size:9px;color:var(--text2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;}
.mr-top{display:flex;align-items:center;justify-content:space-between;}
.mr-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:11px;}
.mr-date-badge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;margin-right:3px;}

/* シート */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;display:flex;align-items:flex-end;}
.sheet{background:var(--surface);border-radius:16px 16px 0 0;width:100%;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 16px);max-height:85dvh;overflow-y:auto;}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 12px;}
.sheet-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.sheet-close{background:none;border:none;cursor:pointer;color:var(--text3);font-size:20px;}
.form-lbl{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:3px;display:block;}
.form-in{width:100%;font-size:14px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);-webkit-appearance:none;margin-bottom:10px;}
.form-in:focus{outline:none;border-color:var(--blue);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.btn-primary{background:var(--blue);color:#fff;border:none;border-radius:20px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;width:100%;margin-top:4px;}
.btn-secondary{background:none;border:1px solid var(--border);border-radius:20px;padding:9px 18px;font-size:13px;color:var(--text2);cursor:pointer;width:100%;margin-top:6px;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-title"><i class="ti ti-pill" aria-hidden="true"></i>PharmWS</div>
    <div class="header-sync"><i class="ti ti-brand-google" aria-hidden="true"></i>連携済み</div>
  </div>
  <div class="grid">
    <!-- ① カレンダー -->
    <div class="pane">
      <div class="pane-header">
        <div class="pane-title"><i class="ti ti-calendar" aria-hidden="true"></i>カレンダー</div>
        <div class="live-dot"></div>
      </div>
      <div class="pane-body">
        <div class="cal-nav">
          <button class="cal-nav-btn" id="cal-prev">‹</button>
          <span class="cal-month" id="cal-title"></span>
          <button class="cal-nav-btn" id="cal-next">›</button>
        </div>
        <div class="cal-grid" id="cal-dow"></div>
        <div class="cal-grid" id="cal-grid" style="margin-top:2px;"></div>
      </div>
    </div>
    <!-- ② 予定 -->
    <div class="pane">
      <div class="pane-header">
        <div class="pane-title"><i class="ti ti-list" aria-hidden="true"></i>予定</div>
        <button class="btn-icon" onclick="openSheet('ev')" aria-label="追加"><i class="ti ti-plus" aria-hidden="true"></i></button>
      </div>
      <div class="pane-body">
        <div class="sched-date" id="sched-date"></div>
        <div id="timeline"></div>
      </div>
    </div>
    <!-- ③ タスク -->
    <div class="pane">
      <div class="pane-header">
        <div class="pane-title"><i class="ti ti-check" aria-hidden="true"></i>タスク</div>
        <button class="btn-icon" onclick="openSheet('task')" aria-label="追加"><i class="ti ti-plus" aria-hidden="true"></i></button>
      </div>
      <div class="pane-body" id="task-list"></div>
    </div>
    <!-- ④ MRアポ -->
    <div class="pane">
      <div class="pane-header">
        <div class="pane-title"><i class="ti ti-users" aria-hidden="true"></i>MRアポ</div>
        <button class="btn-icon" onclick="openSheet('mr')" aria-label="追加"><i class="ti ti-plus" aria-hidden="true"></i></button>
      </div>
      <div class="pane-body" id="mr-list"></div>
    </div>
  </div>
</div>

<!-- シートモーダル -->
<div class="sheet-bg" id="sheet" style="display:none;" onclick="if(event.target===this)closeSheet()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title"><span id="sheet-title"></span><button class="sheet-close" onclick="closeSheet()"><i class="ti ti-x"></i></button></div>
    <div id="sheet-body"></div>
  </div>
</div>

<script>
const DOWS=['日','月','火','水','木','金','土'];
const fmt=(y,m,d)=>y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
let calYear,calMonth,selectedDate;
const today=new Date(),yr=today.getFullYear(),mo=today.getMonth();

const gcalData={
  '2026-06-01':[{title:'日勤',time:'08:30',end:'17:30',type:'day'},{title:'明治面談',time:'17:15',end:'18:15',type:'gcal'}],
  '2026-06-02':[{title:'日勤',time:'08:30',end:'17:30',type:'day'},{title:'こうけっせんの話し合い',time:'15:00',end:'16:00',type:'gcal'},{title:'組合',time:'17:00',end:'18:00',type:'gcal'}],
  '2026-06-03':[{title:'日勤',time:'08:30',end:'17:30',type:'day'}],
  '2026-06-04':[{title:'日勤',time:'08:30',end:'17:30',type:'day'}],
  '2026-06-05':[{title:'休み',time:'',end:'',type:'off'}],
  '2026-06-06':[{title:'休み',time:'',end:'',type:'off'}],
  '2026-06-07':[{title:'休み',time:'',end:'',type:'off'}],
  '2026-06-08':[{title:'日勤',time:'08:30',end:'17:30',type:'day'}],
  '2026-06-09':[{title:'日勤',time:'08:30',end:'17:30',type:'day'}],
  '2026-06-10':[{title:'休み',time:'',end:'',type:'off'}],
  '2026-06-11':[{title:'日勤',time:'08:30',end:'17:30',type:'day'},{title:'健康診断',time:'10:00',end:'11:00',type:'gcal'}],
  '2026-06-12':[{title:'日勤',time:'08:30',end:'17:30',type:'day'}],
  '2026-06-13':[{title:'休み',time:'',end:'',type:'off'},{title:'ガス漏れ警報器交換',time:'13:00',end:'16:00',type:'gcal'}],
  '2026-06-14':[{title:'休み',time:'',end:'',type:'off'}],
  '2026-06-15':[{title:'日勤',time:'08:30',end:'17:30',type:'day'},{title:'強羅温泉 ホテルマロウド箱根',time:'',end:'',type:'gcal'}],
  '2026-06-16':[{title:'休み',time:'',end:'',type:'off'},{title:'レンジフード掃除',time:'09:00',end:'10:00',type:'gcal'}],
  '2026-06-17':[{title:'日勤',time:'08:30',end:'17:30',type:'day'}],
  '2026-06-18':[{title:'日勤',time:'08:30',end:'17:30',type:'day'}],
  '2026-06-19':[{title:'日勤',time:'08:30',end:'17:30',type:'day'}],
  '2026-06-20':[{title:'仕事',time:'',end:'',type:'work'},{title:'廃棄金額確認',time:'08:00',end:'09:00',type:'gcal'}],
  '2026-06-21':[{title:'休み',time:'',end:'',type:'off'},{title:'マイナビ説明会',time:'13:00',end:'15:00',type:'gcal'}],
  '2026-06-22':[{title:'日勤',time:'08:30',end:'17:30',type:'day'}],
  '2026-06-23':[{title:'休み',time:'',end:'',type:'off'},{title:'パス大会',time:'17:15',end:'18:15',type:'gcal'}],
  '2026-06-24':[{title:'日勤',time:'08:30',end:'17:30',type:'day'}],
  '2026-06-25':[{title:'日勤',time:'08:30',end:'17:30',type:'day'},{title:'キャリア開発支援',time:'13:00',end:'16:30',type:'gcal'}],
  '2026-06-26':[{title:'日勤',time:'08:30',end:'17:30',type:'day'}],
  '2026-06-27':[{title:'休み',time:'',end:'',type:'off'}],
  '2026-06-28':[{title:'仕事',time:'',end:'',type:'work'}],
  '2026-06-29':[{title:'日勤',time:'08:30',end:'17:30',type:'day'}],
  '2026-06-30':[{title:'日勤',time:'08:30',end:'17:30',type:'day'},{title:'新人進捗確認',time:'08:30',end:'09:30',type:'gcal'}],
};
let localEvents={};

function getShift(ds){return(gcalData[ds]||[]).find(e=>['day','off','work'].includes(e.type));}

/* ===== タスクの期限カテゴリ ===== */
function getTaskCat(due){
  if(!due)return'none';
  const now=new Date();now.setHours(0,0,0,0);
  const d=new Date(due);
  const diff=Math.floor((d-now)/86400000);
  if(diff<0)return'overdue';   // 期限切れ
  if(diff===0)return'today';   // 今日 → 赤
  if(diff<=6)return'week';     // 今週 → 黄
  if(diff<=30)return'month';   // 今月 → 青
  return'future';              // 来月以降 → 緑
}
const catBorderColor={overdue:'#C0392B',today:'#C0392B',week:'#B8860B',month:'#2C5F8A',future:'#1D8A6B',none:'#ccc'};
const catTagCls={overdue:'tag-red',today:'tag-red',week:'tag-yellow',month:'tag-blue',future:'tag-green',none:'tag-gray'};
const catLabel={overdue:'期限切れ',today:'今日',week:'今週',month:'今月',future:'来月以降',none:''};

/* ===== カレンダー ===== */
function initCal(){
  calYear=yr;calMonth=mo;
  selectedDate=fmt(yr,mo,today.getDate());
  renderCal();renderSchedule(selectedDate);
}
function renderCal(){
  document.getElementById('cal-title').textContent=calYear+'/'+(calMonth+1);
  document.getElementById('cal-dow').innerHTML=DOWS.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const grid=document.getElementById('cal-grid');grid.innerHTML='';
  const first=new Date(calYear,calMonth,1).getDay();
  const last=new Date(calYear,calMonth+1,0).getDate();
  for(let i=0;i<first;i++){const pv=new Date(calYear,calMonth,0-first+i+1).getDate();grid.innerHTML+=`<div class="cal-day other-month"><div class="dn">${pv}</div></div>`;}
  for(let d=1;d<=last;d++){
    const ds=fmt(calYear,calMonth,d);
    const isT=today.getFullYear()===calYear&&today.getMonth()===calMonth&&today.getDate()===d;
    const shift=getShift(ds);
    const shL=shift?.title||'';
    const shC=shift?.type==='day'?'sc-day':shift?.type==='work'?'sc-work':'sc-off';
    const hasEv=(gcalData[ds]||[]).some(e=>!['day','off','work'].includes(e.type))||(localEvents[ds]||[]).length>0;
    grid.innerHTML+=`<div class="cal-day${isT?' today':''}" onclick="onDayClick('${ds}')">
      <div class="dn">${d}</div>
      ${shL?`<div class="sc ${shC}">${shL}</div>`:'<div style="height:12px;"></div>'}
      ${hasEv?'<div class="ep"></div>':'<div style="height:3px;"></div>'}
    </div>`;
  }
  const rem=42-first-last;for(let i=1;i<=rem;i++)grid.innerHTML+=`<div class="cal-day other-month"><div class="dn">${i}</div></div>`;
}
function onDayClick(ds){
  selectedDate=ds;renderSchedule(ds);showAdjustSheet(ds);
}
document.getElementById('cal-prev').onclick=()=>{calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCal();};
document.getElementById('cal-next').onclick=()=>{calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCal();};

/* ===== スケジュール ===== */
function renderSchedule(ds){
  if(!ds)ds=selectedDate;
  const d=new Date(ds+'T00:00:00');
  document.getElementById('sched-date').textContent=(d.getMonth()+1)+'/'+(d.getDate())+' （'+DOWS[d.getDay()]+'）';
  const all=[...(gcalData[ds]||[]),...(localEvents[ds]||[])].sort((a,b)=>{
    if(!a.time&&!b.time)return 0;if(!a.time)return-1;if(!b.time)return 1;return a.time.localeCompare(b.time);
  });
  const tl=document.getElementById('timeline');
  if(!all.length){tl.innerHTML=`<div class="no-ev">予定なし</div>`;return;}
  tl.innerHTML=all.map(e=>{
    const bc=e.type==='day'?'bar-day':e.type==='off'?'bar-off':e.type==='work'?'bar-work':'bar-gcal';
    return `<div class="tl-item">
      <div class="tl-time">${e.time||'終日'}</div>
      <div class="tl-bar ${bc}"></div>
      <div style="flex:1;"><div class="tl-txt">${e.title}</div>${e.note?`<div class="tl-sub">${e.note}</div>`:''}</div>
    </div>`;
  }).join('');
}

/* ===== 日程調整シート ===== */
function showAdjustSheet(ds){
  const d=new Date(ds+'T00:00:00');
  const label=(d.getMonth()+1)+'月'+d.getDate()+'日（'+DOWS[d.getDay()]+'）';
  document.getElementById('sheet-title').textContent=label;
  const shift=getShift(ds);
  const others=(gcalData[ds]||[]).filter(e=>!['day','off','work'].includes(e.type));
  const shCls=shift?.type==='day'?'sc-day':shift?.type==='work'?'sc-work':'sc-off';
  let html=`<div style="margin-bottom:14px;">
    <div style="font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;">シフト</div>
    <div style="font-size:13px;padding:8px 10px;border-radius:8px;background:var(--bg);">
      ${shift?`<span class="sc ${shCls}" style="font-size:11px;padding:2px 7px;">${shift.title}</span>${shift.time?' '+shift.time+'〜'+shift.end:''}`:'<span style="color:var(--text3);">データなし</span>'}
    </div></div>`;
  if(others.length){
    html+=`<div style="font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;">その他の予定</div>`;
    html+=others.map(e=>`<div style="font-size:13px;padding:7px 10px;border-radius:7px;background:var(--bg);margin-bottom:5px;">${e.time?'<span style="font-size:11px;color:var(--text2);margin-right:6px;">'+e.time+'</span>':''}<strong>${e.title}</strong></div>`).join('');
  }
  html+=`<button class="btn-primary" style="margin-top:12px;" onclick="closeSheet()">閉じる</button>`;
  document.getElementById('sheet-body').innerHTML=html;
  document.getElementById('sheet').style.display='flex';
}

/* ===== シート共通 ===== */
function openSheet(type){
  const title=document.getElementById('sheet-title');
  const body=document.getElementById('sheet-body');
  if(type==='ev'){
    title.textContent='予定を追加';
    const d=new Date(selectedDate+'T00:00:00');
    body.innerHTML=`
      <label class="form-lbl">タイトル</label>
      <input type="text" class="form-in" id="ev-title" placeholder="例：病棟回診（内科）">
      <div class="form-row">
        <div><label class="form-lbl">開始</label><input type="time" class="form-in" id="ev-start" value="09:00"></div>
        <div><label class="form-lbl">終了</label><input type="time" class="form-in" id="ev-end" value="10:00"></div>
      </div>
      <label class="form-lbl">場所・メモ</label>
      <input type="text" class="form-in" id="ev-note" placeholder="例：4階東病棟">
      <div style="font-size:11px;color:var(--text2);margin-bottom:10px;">日付：${(d.getMonth()+1)}月${d.getDate()}日</div>
      <button class="btn-primary" onclick="saveEvent()">保存</button>
      <button class="btn-secondary" onclick="closeSheet()">キャンセル</button>`;
  }else if(type==='task'){
    title.textContent='タスクを追加';
    body.innerHTML=`
      <label class="form-lbl">タスク名</label>
      <input type="text" class="form-in" id="task-title" placeholder="例：持参薬確認">
      <div class="form-row">
        <div><label class="form-lbl">期限</label><input type="date" class="form-in" id="task-due"></div>
        <div><label class="form-lbl">重要度</label>
          <select class="form-in" id="task-imp">
            <option value="high">高</option><option value="mid" selected>中</option><option value="low">低</option>
          </select>
        </div>
      </div>
      <button class="btn-primary" onclick="saveTask()">保存</button>
      <button class="btn-secondary" onclick="closeSheet()">キャンセル</button>`;
  }else if(type==='mr'){
    title.textContent='MRアポを追加';
    body.innerHTML=`
      <div class="form-row">
        <div><label class="form-lbl">MR名・会社</label><input type="text" class="form-in" id="mr-name" placeholder="田中 / エーザイ"></div>
        <div><label class="form-lbl">日時</label><input type="datetime-local" class="form-in" id="mr-date"></div>
      </div>
      <label class="form-lbl">製品・目的</label>
      <input type="text" class="form-in" id="mr-product" placeholder="レケンビ 情報提供">
      <button class="btn-primary" onclick="saveMr()">Googleカレンダーに追加</button>
      <button class="btn-secondary" onclick="closeSheet()">キャンセル</button>`;
  }
  document.getElementById('sheet').style.display='flex';
}
function closeSheet(){document.getElementById('sheet').style.display='none';}
function saveEvent(){
  const title=document.getElementById('ev-title')?.value.trim();if(!title)return;
  if(!localEvents[selectedDate])localEvents[selectedDate]=[];
  localEvents[selectedDate].push({id:'l'+Date.now(),time:document.getElementById('ev-start').value,end:document.getElementById('ev-end').value,title,note:document.getElementById('ev-note').value.trim(),type:'gcal',src:'local'});
  closeSheet();renderSchedule(selectedDate);renderCal();
}

/* ===== タスク（タブなし・期限順） ===== */
let tasks=[
  {text:'持参薬確認（木田さん）',done:false,id:1,due:fmt(yr,mo,today.getDate()),imp:'high'},
  {text:'TDMレポート提出',done:true,id:2,due:fmt(yr,mo,today.getDate()),imp:'high'},
  {text:'腎機能別用量表の更新',done:false,id:3,due:fmt(yr,mo,today.getDate()+3),imp:'mid'},
  {text:'OJT資料作成',done:false,id:4,due:fmt(yr,mo,today.getDate()+5),imp:'low'},
  {text:'抗血栓療法マニュアル改訂',done:false,id:5,due:fmt(yr,mo,today.getDate()+14),imp:'high'},
  {text:'研修スケジュール確定',done:false,id:6,due:fmt(yr,mo,today.getDate()+20),imp:'mid'},
];

function saveTask(){
  const title=document.getElementById('task-title')?.value.trim();if(!title)return;
  tasks.push({text:title,done:false,id:Date.now(),due:document.getElementById('task-due').value,imp:document.getElementById('task-imp').value});
  closeSheet();renderTasks();
}
function toggleTask(id){const t=tasks.find(t=>t.id===id);if(t){t.done=!t.done;renderTasks();}}
function deleteTask(id){tasks=tasks.filter(t=>t.id!==id);renderTasks();}

function renderTasks(){
  const list=document.getElementById('task-list');
  if(!tasks.length){list.innerHTML=`<div class="empty">タスクなし</div>`;return;}
  // 期限でソート：期限なし→末尾、完了→末尾、期限切れ→先頭
  const sorted=[...tasks].sort((a,b)=>{
    if(a.done!==b.done)return a.done?1:-1;
    if(!a.due&&!b.due)return 0;
    if(!a.due)return 1;
    if(!b.due)return-1;
    return a.due.localeCompare(b.due);
  });
  const iL={high:'高',mid:'中',low:'低'};
  const iC={high:'tag-hi',mid:'tag-mi',low:'tag-lo'};
  list.innerHTML=sorted.map(t=>{
    const cat=t.done?'none':getTaskCat(t.due);
    const borderColor=catBorderColor[cat];
    const dueDisp=t.due?t.due.slice(5).replace('-','/'):'';
    return `<div class="task-item${t.done?' done':''}" style="border-left-color:${borderColor};">
      <input type="checkbox" class="task-cb" ${t.done?'checked':''} onchange="toggleTask(${t.id})">
      <div style="flex:1;min-width:0;">
        <div class="task-nm">${t.text}</div>
        <div class="task-meta">
          ${dueDisp?`<span style="font-size:8px;color:var(--text2);">${dueDisp}</span>`:''}
          ${!t.done&&cat!=='none'?`<span class="tag ${catTagCls[cat]}">${catLabel[cat]}</span>`:''}
          <span class="tag ${iC[t.imp]}">重要${iL[t.imp]}</span>
        </div>
      </div>
      <button class="task-del" onclick="deleteTask(${t.id})"><i class="ti ti-x"></i></button>
    </div>`;
  }).join('');
}

/* ===== MRアポ（日付順） ===== */
let mrList=[
  {id:1,name:'山田 / ファイザー',date:'2026-06-09T14:00',product:'プレタール 適応外処方確認'},
  {id:2,name:'鈴木 / 第一三共',date:'2026-06-11T10:30',product:'エドキサバン 新規採用申請'},
];

function saveMr(){
  const name=document.getElementById('mr-name')?.value.trim();if(!name)return;
  const date=document.getElementById('mr-date').value;
  const product=document.getElementById('mr-product').value.trim();
  mrList.push({id:Date.now(),name,date,product});
  mrList.sort((a,b)=>a.date.localeCompare(b.date));
  closeSheet();renderMr();
  if(date){
    const dt=new Date(date);
    const s=dt.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
    const e=new Date(dt.getTime()+30*60000).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
    window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent('MRアポ：'+name)}&dates=${s}/${e}&details=${encodeURIComponent(product)}`,'_blank');
  }
}
function deleteMr(id){mrList=mrList.filter(m=>m.id!==id);renderMr();}

function getMrCat(dateStr){
  if(!dateStr)return'none';
  const now=new Date();now.setHours(0,0,0,0);
  const d=new Date(dateStr);
  const diff=Math.floor((d-now)/86400000);
  if(diff<0)return'past';
  if(diff===0)return'today';
  if(diff<=6)return'week';
  if(diff<=30)return'month';
  return'future';
}
const mrCatColor={past:'#aaa',today:'#C0392B',week:'#B8860B',month:'#2C5F8A',future:'#1D8A6B',none:'#ccc'};
const mrCatLabel={past:'終了',today:'今日',week:'今週',month:'今月',future:'来月以降',none:''};

function renderMr(){
  const list=document.getElementById('mr-list');
  if(!mrList.length){list.innerHTML=`<div class="empty">アポなし</div>`;return;}
  // 日付昇順（過去→未来）
  const sorted=[...mrList].sort((a,b)=>a.date.localeCompare(b.date));
  list.innerHTML=sorted.map(m=>{
    const dt=m.date?new Date(m.date):null;
    const ds=dt?`${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`:'';
    const cat=getMrCat(m.date);
    const color=mrCatColor[cat];
    const label=mrCatLabel[cat];
    return `<div class="mr-card" style="border-left-color:${color};">
      <div class="mr-top">
        <span class="mr-nm"><i class="ti ti-user" style="font-size:11px;margin-right:3px;" aria-hidden="true"></i>${m.name}</span>
        <button class="mr-del" onclick="deleteMr(${m.id})" aria-label="削除"><i class="ti ti-x"></i></button>
      </div>
      <div class="mr-meta">
        <span style="font-weight:600;color:${color};">${ds}</span>
        ${label?`<span class="tag" style="background:none;color:${color};border:0.5px solid ${color};font-size:8px;padding:0px 4px;">${label}</span>`:''}
      </div>
      <div style="font-size:10px;color:var(--text2);margin-top:2px;">${m.product}</div>
    </div>`;
  }).join('');
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
initCal();renderTasks();renderMr();
</script>
